n TBD</text><text x="900" y="865" class="body" text-anchor="start">롤 단열재 · 보관 상태 ING-16</text><text x="900" y="889" class="meta" text-anchor="start">Stored insulation roll; installation unverified</text><path class="leader" d="M72 910L1368 910"/><text x="72" y="946" class="small" text-anchor="start">사진에 보이는 부재와 미확인 구간을 구분한 도해입니다. 완성 벽체의 시공·성능을 입증하는 자료는 아닙니다.</text><text x="72" y="974" class="meta" text-anchor="start">Observed components are separated from unknowns. This is not proof of a completed wall assembly or its performance.</text>
