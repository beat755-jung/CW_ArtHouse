<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 1440 1080"><title id="title">외벽 상세 확대도 · D1 — prototype-01</title><desc id="desc">WALL DETAIL / INTERIOR → EXTERIOR. 고객 이해를 위한 개념도. 축척 없음. 비례·단면 구성 추정. 점선과 [확인 필요]는 미확인 구간. 사진 근거 / Photo references: ING-08 · ING-16 · ING-44 · 표기 인용은 자재 성능·등급의 확정이 아닙니다.</desc><defs><pattern id="panel-joints" width="86" height="460" patternUnits="userSpaceOnUse"><path stroke="#8a857f" stroke-width=".65" d="M0 0v460"/></pattern><pattern id="cut-hatch" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><path stroke="#b8956a" stroke-width="1" d="M0 0v10"/></pattern><pattern id="unknown-hatch" width="16" height="16" patternUnits="userSpaceOnUse"><path stroke="#8a857f" stroke-width="1" d="M3 3h2"/></pattern></defs><style>text{font-family:Arial,&quot;Malgun Gothic&quot;,sans-serif;fill:#ede8e0}.title{font-size:38px}.body{font-size:19px}.meta{font-size:15px;fill:#8a857f}.accent{font-size:18px;fill:#b8956a}.small{font-size:16px}.tag{font-size:15px;fill:#b8956a;letter-spacing:2px}.fine{fill:none;stroke:#ede8e0;stroke-width:1.2}.leader{stroke:#8a857f;stroke-width:.8}.guess,.leader{fill:none}.guess,.unknown,.window{stroke:#b8956a}.window{fill:none;stroke-width:1.25}.guess,.unknown{stroke-width:1.2;stroke-dasharray:7 5}.unknown{fill:url(#unknown-hatch)}</style><text x="72" y="65" class="tag" text-anchor="start">CW_ART HOUSE / SPATIAL STUDY</text><text x="1368" y="65" class="tag" text-anchor="end">CONCEPT / 개념도</text><text x="72" y="120" class="title" text-anchor="start">외벽 상세 확대도 · D1</text><text x="72" y="153" class="meta" text-anchor="start">WALL DETAIL / INTERIOR → EXTERIOR</text><path d="M72 180h1296" class="leader"/><text x="72" y="222" class="body" text-anchor="start">04 / D1 · 거실 외벽의 일반부 확대</text><text x="72" y="246" class="meta" text-anchor="start">Living exterior wall · Schematic enlarged section</text><text x="1368" y="222" class="accent" text-anchor="end">단면 구성 추정 / Inferred build-up</text><text x="130" y="293" class="accent" text-anchor="start">실내 Interior</text><path d="M295 287h405" class="leader"/><path d="m687 280 13 7-13 7" class="window"/><text x="735" y="293" class="accent" text-anchor="start">실외 Exterior</text><g id="layer-interior-finish"><rect width="25" height="360" x="165" y="335" class="unknown"/><text x="177" y="730" class="accent" text-anchor="middle">01</text></g><g id="layer-stud-zone"><rect width="190" height="360" x="220" y="335" class="guess"/><path fill="url(#cut-hatch)" stroke="#ede8e0" stroke-width="3" d="M260 352h90v32h-10v-22h-70v306h70v-22h10v32h-90Z"/><text x="310" y="730" class="accent" text-anchor="middle">02</text></g><g id="layer-panel"><rect width="16" height="360" x="455" y="335" class="fine"/><rect width="145" height="360" x="471" y="335" class="unknown"/><rect width="16" height="360" x="616" y="335" class="fine"/><text x="543" y="730" class="accent" text-anchor="middle">03</text><text x="632" y="730" class="accent" text-anchor="middle">04</text></g><g><circle cx="178" cy="350" r="3" fill="#b8956a"/><path d="m178 350 542-41h168" class="guess"/><text x="900" y="315" class="accent" text-anchor="start">01 내장 마감 [확인 필요]</text><text x="900" y="339" class="meta" text-anchor="start">Interior lining / finish unverified</text></g><g><circle cx="265" cy="405" r="3" fill="#b8956a"/><path d="m265 405 470 4h153" class="leader"/><text x="900" y="415" class="body" text-anchor="start">02 강재 벽 스터드 · ING-44</text><text x="900" y="439" class="meta" text-anchor="start">Steel wall studs · observed</text></g><g><circle cx="540" cy="485" r="3" fill="#b8956a"/><path d="m540 485 210 24h138" class="guess"/><text x="900" y="515" class="accent" text-anchor="start">03 패널 심재 [확인 필요]</text><text x="900" y="539" class="meta" text-anchor="start">Core type / thickness unverified</text></g><g><circle cx="630" cy="585" r="3" fill="#b8956a"/><path d="m630 585 135 24h123" class="leader"/><text x="900" y="615" class="body" text-anchor="start">04 외피 패널 면재 · ING-08/44</text><text x="900" y="639" class="meta" text-anchor="start">Panel facing · finish specification TBD</text></g><text x="135" y="790" class="accent" text-anchor="start">방수·방습층 [확인 필요]</text><text x="135" y="814" class="meta" text-anchor="start">Membranes: presence / position unverified</text><text x="135" y="844" class="small" text-anchor="start">설치 위치를 알 수 없어 특정 레이어로 배치하지 않았습니다.</text><text x="135" y="870" class="meta" text-anchor="start">No membrane position is implied by this diagram.</text><text x="900" y="715" class="body" text-anchor="start">이음부 실링 · 창 주변 발포 충진</text><text x="900" y="739" class="meta" text-anchor="start">Joint sealant / window foam · ING-44</text><text x="900" y="790" class="body" text-anchor="start">‘PIR PANEL’ 표기 · ING-44</text><text x="900" y="814" class="meta" text-anchor="start">Marking observed; product specification TBD</text><text x="900" y="865" class="body" text-anchor="start">롤 단열재 · 보관 상태 ING-16</text><text x="900" y="889" class="meta" text-anchor="start">Stored insulation roll; installation unverified</text><path d="M72 910h1296" class="leader"/><text x="72" y="946" class="small" text-anchor="start">사진에 보이는 부재와 미확인 구간을 구분한 도해입니다. 완성 벽체의 시공·성능을 입증하는 자료는 아닙니다.</text><text x="72" y="974" class="meta" text-anchor="start">Observed components are separated from unknowns. This is not proof of a completed wall assembly or its performance.</text><path d="M72 998h1296" class="leader"/><text x="72" y="1025" class="small" text-anchor="start">개념 상세 · 실제 순서·간격·두께·접합은 [확인 필요] / Actual sequence, spacing, thickness and connections are unverified.</text><text x="72" y="1054" class="meta" text-anchor="start">사진 근거 / Photo references: ING-08 · ING-16 · ING-44 · 표기 인용은 자재 성능·등급의 확정이 아닙니다.</text></svg>